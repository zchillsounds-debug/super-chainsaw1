<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Madinat al-Salam</title>
<meta name="theme-color" content="#2a1a10" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="loader"><div class="lt">Madinat al-Salam</div><div class="ls">Raising the Round City…</div><div class="lbar"><i></i></div></div>
<script>
// Round 24: travelling between regions, the loader becomes a travel card: where Salim is going, and why
try {
  var c = JSON.parse(sessionStorage.getItem('sob.travelcard') || 'null'); sessionStorage.removeItem('sob.travelcard');
  if (c) {
    var L = document.getElementById('loader'), esc = function (x) { return String(x || '').replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); };
    L.classList.add('travel'); if (c.rtl) L.setAttribute('dir', 'rtl');
    L.innerHTML = '<div class="tar">' + esc(c.ar) + '</div><div class="trule"><i></i><b></b><i></i></div><div class="ten">' + esc(c.en) + '</div><div class="tsub">' + esc(c.sub) + '</div><div class="lbar"><i></i></div>';
  }
} catch (e) { /* the plain loader */ }
</script>
<div id="game"></div>
<div id="ui"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
