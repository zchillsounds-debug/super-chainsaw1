# Builds the Critter Clash Android APK (Capacitor wrapper, landscape, fullscreen) and
# publishes it to the orphan branch `apk-critter-clash` so it can be fetched over git.
name: Critter Clash APK
on:
  push:
    branches: ['ccr-**', 'claude/**', main]
    paths: ['games/critter-clash/**', '.github/workflows/critter-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/critter-clash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: games/critter-clash/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Publish node_modules to the deps-critter-clash branch (for cloud dev sessions without npm access)
        continue-on-error: true
        run: |
          H=$(sha1sum package-lock.json | cut -c1-12)
          if git ls-remote --exit-code "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" deps-critter-clash >/dev/null 2>&1 && \
             git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" deps-critter-clash && \
             git log -1 --format=%s FETCH_HEAD | grep -q "lock $H"; then echo "deps up to date"; exit 0; fi
          mkdir -p /tmp/deps && tar czf /tmp/deps/node_modules.tgz node_modules && ls -la /tmp/deps
          cd /tmp/deps && split -b 90m node_modules.tgz nm.part. && rm node_modules.tgz
          git init -q && git checkout -q -b deps-critter-clash
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "node_modules for lock $H"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" deps-critter-clash
      - run: npx vite build
      - run: npx cap add android
      - name: Landscape, fullscreen, icon
        run: |
          python3 - <<'PY'
          import re, pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          s = s.replace('<activity', '<activity android:screenOrientation="sensorLandscape"', 1)
          if 'WRITE_EXTERNAL_STORAGE' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>')
          m.write_text(s)
          st = pathlib.Path('android/app/src/main/res/values/styles.xml')
          s = st.read_text()
          s = re.sub(r'(<style name="AppTheme.NoActionBar"[^>]*>)', r'\1\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>', s)
          st.write_text(s)
          PY
          if [ -f public/icon-512.png ]; then
            for d in android/app/src/main/res/mipmap-*; do
              for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
                [ -f "$d/$f" ] && cp public/icon-512.png "$d/$f"
              done
            done
          fi
      - run: npx cap sync android
      - name: Same signing key and a rising version on every build (so each APK installs over the last and keeps the save)
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          g = pathlib.Path('android/app/build.gradle')
          s = g.read_text()
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          s = re.sub(r'versionCode \d+', f'versionCode {1000 + run}', s, 1)
          s = re.sub(r'versionName "[^"]*"', f'versionName "1.0.{run}"', s, 1)
          sign = """
              signingConfigs {
                  debug {
                      storeFile file('../../signing/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          """
          s = s.replace('    buildTypes {', sign + '    buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }', 1)
          g.write_text(s)
          print(s)
          PY
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Build APK (retries the Gradle download on network resets)
        run: cd android && chmod +x gradlew && for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && exit 0; echo "retry $i"; sleep $((i*10)); done; exit 1
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk critter-clash.apk
      - name: Check the APK is signed with the repo key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs critter-clash.apk | tee /tmp/certs.txt
          grep -qi "a7e761de86ab374fb8191b1df011e8fdb673947efe6eb8fa816922f5fc992c07" <(tr -d ':' < /tmp/certs.txt | tr 'A-F' 'a-f')
      - uses: actions/upload-artifact@v4
        with: { name: critter-clash-apk, path: games/critter-clash/critter-clash.apk }
      - name: Publish APK to the apk-critter-clash branch
        run: |
          mkdir out && cp critter-clash.apk out/ && cd out
          git init -q && git checkout -q -b apk-critter-clash
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add critter-clash.apk && git commit -qm "APK from ${GITHUB_SHA::7} (version 1.0.${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-critter-clash
