# Builds a debug-signed APK of the game (Capacitor WebView wrapper) and attaches it to the run as an artifact.
name: Build Android APK
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk sands-of-baghdad.apk
      - uses: actions/upload-artifact@v4
        with: { name: sands-of-baghdad-apk, path: sands-of-baghdad.apk }
