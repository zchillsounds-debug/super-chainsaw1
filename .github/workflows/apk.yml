# Builds a debug-signed APK of the game (Capacitor WebView wrapper) and attaches it to the run as an artifact.
name: Build Android APK
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Build APK (retries the Gradle download on network resets)
        run: cd android && chmod +x gradlew && for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && exit 0; echo "retry $i"; sleep $((i*10)); done; exit 1
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk sands-of-baghdad.apk
      - uses: actions/upload-artifact@v4
        with: { name: sands-of-baghdad-apk, path: sands-of-baghdad.apk }
      # also publish the APK on an orphan branch so it can be fetched over plain git
      - name: Publish APK to the apk-builds branch
        run: |
          mkdir out && cp sands-of-baghdad.apk out/ && cd out
          git init -q && git checkout -q -b apk-builds
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add sands-of-baghdad.apk && git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-builds
