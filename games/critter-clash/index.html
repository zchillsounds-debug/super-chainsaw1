<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b1140" />
<title>Critter Clash</title>
<link rel="icon" href="./icon-512.png" />
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="splash">
  <style>
    #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #ff8a3d 0%, #c2307a 45%, #1b1140 100%); font-family: system-ui, sans-serif; transition: opacity .45s; }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash .sp-in { text-align: center; color: #fff; }
    #splash .sp-logo { font: 900 clamp(44px, 11vmin, 96px)/0.9 system-ui, sans-serif; letter-spacing: 2px; -webkit-text-stroke: 8px #2a1630; paint-order: stroke fill; text-shadow: 0 8px 0 #2a1630; transform: rotate(-4deg); }
    #splash .sp-logo b { display: block; color: #ffe36b; font-size: 1.15em; }
    #splash .sp-paw { width: 54px; height: 54px; margin: 28px auto 10px; animation: spPaw .9s cubic-bezier(.3,1.6,.5,1) infinite alternate; }
    #splash .sp-msg { font-weight: 800; font-size: 14px; opacity: .85; letter-spacing: .5px; }
    #splash .sp-bar { width: min(260px, 60vw); height: 10px; border-radius: 99px; background: rgba(0,0,0,.3); margin: 10px auto 0; overflow: hidden; box-shadow: inset 0 0 0 2px #2a1630; }
    #splash .sp-bar i { display: block; height: 100%; width: 4%; background: linear-gradient(90deg, #ffe36b, #ff7a3d); border-radius: 99px; transition: width .25s; }
    @keyframes spPaw { from { transform: translateY(0) rotate(-12deg); } to { transform: translateY(-14px) rotate(12deg) scale(1.08); } }
  </style>
  <div class="sp-in">
    <div class="sp-logo">CRITTER<b>CLASH!</b></div>
    <svg class="sp-paw" viewBox="0 0 64 64"><g fill="#fff" stroke="#2a1630" stroke-width="3"><ellipse cx="32" cy="42" rx="15" ry="12"/><circle cx="15" cy="26" r="7"/><circle cx="26" cy="16" r="7"/><circle cx="38" cy="16" r="7"/><circle cx="49" cy="26" r="7"/></g></svg>
    <div class="sp-msg">Waking up the critters...</div>
    <div class="sp-bar"><i></i></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
